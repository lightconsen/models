# Build the hub data + the web app, deploy the whole thing to gh-pages.
#
# On every push to main (and manually): regenerate dist/ (data is versioned and
# gitignored on main), stage it into the web app, build the Vite SPA with a
# typecheck gate, then force-push the resulting static bundle to the gh-pages
# branch, which GitHub Pages serves at https://models.kiwano.cc.
#
# Notes:
# - web/public/CNAME carries the custom domain through every rebuild — the
#   deploy wipes the branch wholesale, so a CNAME written only by the Pages
#   panel would be deleted by the next deploy.
# - Setup (once): Settings → Pages → Source → "Deploy from a branch" →
#   gh-pages / root, plus the models.kiwano.cc custom domain.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build hub data (repo dist/)
        run: node scripts/generate.mjs

      - name: Build web app (typecheck + build)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Empty worktree on HEAD so the deploy commit's parent is our HEAD;
          # the gh-pages branch is rebuilt wholesale every time.
          rm -rf _deploy
          git worktree add --detach _deploy HEAD
          rm -rf _deploy/*
          cp -R web/dist/. _deploy/

          git -C _deploy add -A
          git -C _deploy commit -m "site: deploy $(git rev-parse --short HEAD)"

          # -f: the branch is owned by this workflow alone; there is nothing to
          # preserve. Pushed from inside the worktree so the ref points at the
          # deploy commit rather than at main.
          git -C _deploy push -f origin HEAD:refs/heads/gh-pages

      - name: Confirm CNAME is on the branch
        run: |
          git ls-tree gh-pages CNAME 2>/dev/null || git fetch origin gh-pages:gh-pages 2>/dev/null; git ls-tree gh-pages CNAME