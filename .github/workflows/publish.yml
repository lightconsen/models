# Publish the Hub artifacts to Cloudflare R2 on every main push.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID – Cloudflare account id
#   CLOUDFLARE_API_TOKEN  – token with R2 edit permission on the bucket
#   R2_BUCKET             – R2 bucket name; must be publicly readable
#                           (r2.dev or a custom domain, e.g. hub.kiwano.cc)
#
# Published keys (bucket root, matching the app's Hub URLs):
#   catalog.json   {"total": N, "entries": [...]}  (Hub protocol v0)
#   models.json    pricing + fx
#   news.json      model news, every news/<id>.json published whole
#   manifest.json  counts/versions + sha256 of all three
#   logos/<id>.<ext>  provider logos, referenced by each catalog entry's
#                     relative `logo` field
#   history/<v>/models.json + history/archive.json
#                  the price archive: every shipped price table, one directory
#                  per version, and an index of version → sha256 → date. The
#                  index is merged on the bucket — each build emits a one-entry
#                  increment, and the step below folds it into the copy R2
#                  already holds, so the archive survives fresh checkouts.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-r2
  cancel-in-progress: true

jobs:
  r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/generate.mjs
      - name: Merge the history increment into the archive on the bucket
        id: version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # dist/history/archive.json carries only this build's version (a fresh
          # checkout builds into an empty dist/). The durable index lives on the
          # bucket: fetch it, fold the increment in — keyed by version, each
          # entry its own sha256 — and upload the merged copy. On the very
          # first run the fetch fails and the increment is the archive.
          npx wrangler r2 object get "$R2_BUCKET/history/archive.json" --file /tmp/archive.remote.json --remote \
            || echo "no archive on the bucket yet — starting it"
          node - <<'EOF'
          const { readFileSync, writeFileSync, existsSync } = require("fs");
          const inc = JSON.parse(readFileSync("dist/history/archive.json", "utf8"));
          let merged = { versions: {} };
          if (existsSync("/tmp/archive.remote.json")) {
            try { merged = JSON.parse(readFileSync("/tmp/archive.remote.json", "utf8")); } catch {}
          }
          merged.versions = { ...merged.versions, ...inc.versions };
          writeFileSync("dist/history/archive.json", JSON.stringify(merged, null, 2) + "\n");
          console.log(`archive holds ${Object.keys(merged.versions).length} version(s)`);
          echo "v=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("dist/manifest.json","utf8")).history.version)')" >> "$GITHUB_OUTPUT"
          EOF
      - name: Upload to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npx wrangler@latest r2 object put "$R2_BUCKET/catalog.json" --file dist/catalog.json --content-type application/json --remote
          npx wrangler r2 object put "$R2_BUCKET/models.json" --file dist/models.json --content-type application/json --remote
          npx wrangler r2 object put "$R2_BUCKET/news.json" --file dist/news.json --content-type application/json --remote
          npx wrangler r2 object put "$R2_BUCKET/manifest.json" --file dist/manifest.json --content-type application/json --remote
          npx wrangler r2 object put "$R2_BUCKET/history/archive.json" --file dist/history/archive.json --content-type application/json --remote
          npx wrangler r2 object put "$R2_BUCKET/history/${{ steps.version.outputs.v }}/models.json" --file dist/history/${{ steps.version.outputs.v }}/models.json --content-type application/json --remote
      - name: Upload logos to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in dist/logos/*; do
            case "${f##*.}" in
              png) ct="image/png";;
              svg) ct="image/svg+xml";;
              jpg|jpeg) ct="image/jpeg";;
              webp) ct="image/webp";;
              *) ct="application/octet-stream";;
            esac
            npx wrangler r2 object put "$R2_BUCKET/${f#dist/}" --file "$f" --content-type "$ct" --remote
          done
