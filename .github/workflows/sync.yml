# Read every price source on a schedule and open a PR for whatever moved.
#
# This is the one workflow here that touches the network, and it is deliberately
# not in the build path: `validate.yml` still runs offline on a PR, and
# `publish.yml` still publishes only what a person merged. Nothing here writes to
# `main`. It runs the same `fetch-all.mjs --write --commit` a person runs by hand,
# so the same guards apply — the trust policy holds back any entry whose source
# proposes more membership change than a machine may apply on its own (that entry
# alone; every other entry is written as usual), the fixed-point check refuses a
# source reporting a value it will not report again, and the commits come out one
# per entry so each diff reads like one.
#
# A PR rather than a direct merge, because the checklist's "checked <date>"
# lines rest on a person having looked. Price-only changes now merge themselves
# (automerge.yml — the trust policy's own line: a price is the vendor's to
# state); a run that adds or leaves a model stays open for a person. An entry
# the policy held back is not in the PR at all: it is named in the body, and the
# next run proposes it again.
#
# The branch name is fixed on purpose: a daily run that finds something updates
# the PR already open rather than stacking a hundred of them.
name: sync

on:
  schedule:
    # Off the hour. Every scheduled job in the world fires at :00, and GitHub
    # delays or drops the runs that arrive with the herd.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A US runner with open egress, which is half the reason this exists. The
      # other half is not needing a laptop awake. As a side effect it answers a
      # question a laptop cannot: `platform.openai.com` and the Gemini pricing
      # page reply `unsupported_country_region_territory` from some networks and
      # not others, and the log below says which way it went.
      - name: Read the sources
        id: read
        run: |
          set +e
          node scripts/fetch-all.mjs --write --commit --outcome "$RUNNER_TEMP/outcome.json" > "$RUNNER_TEMP/sync.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/sync.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # A source that could not be read exits 1 having written nothing for
          # that entry. That is not a reason to lose the entries that did work,
          # so it is carried into the PR body instead of failing the job.
          echo "$code" > "$RUNNER_TEMP/code"

      - name: Count what moved
        id: moved
        run: |
          n=$(git rev-list --count origin/main..HEAD)
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          echo "$n commit(s) ahead of main"

      # The written data has to pass the gate a person's PR would. If the sync
      # produced something invalid it should fail here, not open a PR that
      # validate.yml rejects a minute later.
      - name: Validate
        if: steps.moved.outputs.commits != '0'
        run: |
          node scripts/generate.mjs --check
          node scripts/test-policy.mjs

      - name: Open or update the pull request
        if: steps.moved.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/sync
          READ_CODE: ${{ steps.read.outputs.code }}
        run: |
          set -euo pipefail

          {
            echo "The scheduled run found changes in the vendors' published prices."
            echo
            echo "Each commit below is one entry, so every diff is the change to that"
            echo "vendor alone. The last is the \`global.json\` version bump — the"
            echo "published table is version-gated, so without it the app never sees any"
            echo "of this."
            echo
            echo "Read it the way the checklist asks: \`in\` / \`out\` / \`cache_read\` against"
            echo "the vendor's own page. A correct reading reports \`no change\`, so"
            echo "anything here is a source disagreeing with what the entry carries."
            echo
            # What waits for a person, from the file the pipeline wrote. The
            # fallback is for a run that died before it could write one — the
            # exit code is the only thing left to go on, and it cannot name a
            # cause, which is why it is not the first choice.
            if [ -f "$RUNNER_TEMP/outcome.json" ]; then
              node scripts/report-run.mjs "$RUNNER_TEMP/outcome.json" --pr
            elif [ "$READ_CODE" != "0" ]; then
              echo "> **This run exited $READ_CODE** and wrote no outcome file — read the log"
              echo "> below; the run did not reach the end of the pipeline."
              echo
            fi
            echo "### Commits"
            echo
            git log --format='- `%h` %s' origin/main..HEAD
            echo
            echo "<details><summary>Full run log</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            echo "Opened by the \`sync\` workflow at the vendors' own sources. Price-only"
            echo "runs merge themselves; a run that adds or leaves a model waits for"
            echo "a person."
          } > "$RUNNER_TEMP/pr.md"

          # The branch may already carry an earlier run. Fetching it into a
          # remote-tracking ref is what gives plain `--force-with-lease` something
          # to compare against; on a first run the fetch fails, there is nothing
          # to lease, and the push creates the branch.
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          if gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' | grep -q .; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr.md"
            echo "updated the open PR"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync prices from the vendors' own sources" \
              --body-file "$RUNNER_TEMP/pr.md"
            echo "opened a PR"
          fi

      # Some entries have prices and no *adapter*, for the same reason every time:
      # a page that would not answer. That is a property of the request as much as
      # of the vendor — `ai.google.dev/gemini-api/docs/pricing` answers 200 to a
      # plain `compatible; kiwano-price-check` user-agent and redirects to an OAuth
      # consent screen for a browser one, which is why it sat on the unreadable
      # list until someone tried the other header. So this asks every run, with
      # the same headers the adapters use, and puts the answer in the summary: the
      # day one of these starts answering is the day it is worth an adapter.
      - name: Probe the pages we cannot read
        if: always()
        run: |
          {
            echo "## Pages this runner cannot read"
            echo
            echo "Probed with the same user-agent the adapters send, following no"
            echo "redirects — a page that refuses a browser is not a page that refuses"
            echo "us."
            echo
            echo "| entry | status | body | page |"
            echo "|---|---|---|---|"
            while IFS='|' read -r id url; do
              [ -z "${id:-}" ] && continue
              tmp=$(mktemp)
              code=$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 25 \
                -A 'Mozilla/5.0 (compatible; kiwano-price-check)' "$url" 2>/dev/null || echo 000)
              dollars=$(grep -o '\$[0-9]' "$tmp" 2>/dev/null | wc -l | tr -d ' ')
              case "$code" in
                200) [ "$dollars" -gt 0 ] \
                       && note="**${dollars} prices — an adapter can be written**" \
                       || note="200 but ${dollars} prices in the body" ;;
                000) note="unreachable" ;;
                *)   note="blocked" ;;
              esac
              echo "| \`$id\` | $code | ${dollars} \`\$\` | <$url> |"
              echo "| | | $note | |"
              rm -f "$tmp"
            done <<'PROBE'
          mistral|https://mistral.ai/pricing/api/
          cohere|https://cohere.com/pricing
          PROBE
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The run's own report, from the file it wrote rather than from the exit
      # code — the code cannot tell a held-back entry from a source that would
      # not answer, and the version of this step that guessed told readers the
      # wrong one for three weeks (scripts/report-run.mjs has the story). It runs
      # even when a later step failed, because that is exactly when the reason
      # matters.
      - name: Report the run
        if: always()
        env:
          OUTCOME: ${{ runner.temp }}/outcome.json
        run: node scripts/report-run.mjs "$OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
