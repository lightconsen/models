# PR gate: validate the Hub data, dry-run the artifact build, and typecheck the
# web frontend. The web check needs npm ci + an npm cache, so it is its own step
# with a cache path — separate from the data steps which are zero-dependency.
name: validate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/generate.mjs --check
      # Pure and fixture-free, unlike test-validation.mjs which plants and deletes
      # entries — safe on a runner that must not touch the tree.
      - run: node scripts/test-policy.mjs
      - run: node scripts/test-sources.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The data build first: `npm run build` stages dist/ through its prebuild
      # hook, and dist/ is gitignored, so without this the stage step exits on a
      # missing catalog.json and the job fails before it typechecks anything.
      # This is the same order pages.yml deploys in; it was dropped here, which
      # is why this job had never passed.
      - run: node scripts/generate.mjs
      # Typecheck first: a schema drift in src/data/types.ts sailed past build
      # and hit the homepage as zeroed prices. The deploy only runs `build`, so
      # the gate belongs on the PR, before any deploy can happen.
      - working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
