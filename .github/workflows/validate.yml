# PR gate: validate the Hub data and dry-run the artifact build.
name: validate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/generate.mjs --check
      # Pure and fixture-free, unlike test-validation.mjs which plants and deletes
      # entries — safe on a runner that must not touch the tree.
      - run: node scripts/test-policy.mjs
      - run: node scripts/test-sources.mjs
